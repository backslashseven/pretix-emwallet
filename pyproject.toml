[project]
name = "pretix-emwallet"
dynamic = ["version"]
description = "Apple Wallet tickets for pretix, configured by the Körner eventmanagement software"
readme = "README.rst"
license = {text = "Apache"}
requires-python = ">=3.9"
keywords = ["pretix"]
authors = [
    {name = "Backslash Seven", email = "v.weber@backslashseven.de"},
]
maintainers = [
    {name = "Backslash Seven", email = "v.weber@backslashseven.de"},
]

dependencies = [
    "pretix-passbook",
]

[project.entry-points."pretix.plugin"]
pretix_emwallet = "pretix_emwallet:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_emwallet.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false
